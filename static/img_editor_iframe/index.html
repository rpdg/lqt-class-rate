<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="Cache" content="no-cache">
    <title>2. Mobile</title>
    <link type="text/css" href="css/tui-color-picker.css" rel="stylesheet" />
    <link type="text/css" href="css/service-mobile.css" rel="stylesheet" />
    <style>
        body {
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            position: unset;
        }

        .tui-image-editor {
            width: 100vw;
            height: unset;
            border: 0;
            flex: 1;
            margin-bottom: 80px;
        }

        .button {
            font-size: 10px;
        }

        .disabledBtn {
            color: #999;
            opacity: 0.5;
        }

        #stuName{
            color: #fff;
            font-size: 14px;
            position: absolute;
            z-index: 10;
            top: 15px;
            left: 10px;
        }
    </style>
    <script>var errorLogs = []; window.onerror = function (o, r, e, n) { errorLogs.push({ message: o, source: r, lineno: e, colno: n }); };</script>
</head>

<body>
    <!-- Image editor controls - top area -->
    <div class="header">
        <div id="stuName"></div>
        <div class="menu">
            <!-- <span class="button">
                <img src="img/openImage.png" style="margin-top: 5px" />
                <input type="file" accept="image/*" id="input-image-file" />
            </span> -->
            <!-- <button class="button" id="btn-zoom-in">+</button>
            <button class="button" id="btn-zoom-out">-</button>
            <button class="button" id="btn-move" class="disabledBtn">移动</button> -->
            <button class="button disabled" id="btn-undo"><img src="img/undo.png" /></button>
            <button class="button disabled" id="btn-redo"><img src="img/redo.png" /></button>
            <button class="button" id="btn-remove-active-object"><img src="img/remove.png" /></button>
            <!-- <button class="button" id="btn-download"><img src="img/download.png" /></button> -->
            <button class="button" id="btnPostImage"><img src="img/yes_icon.svg" /></button>
            <button class="button" id="btnCancelEdit"><img src="img/no_icon.svg" /></button>
        </div>
    </div>
    <!-- Image editor area -->

    <!-- Image editor controls - bottom area -->
    <div class="tui-image-editor-controls">
        <ul class="scrollable">

            <li class="menu-item">
                <button class="menu-button" id="btn-add-text">文字</button>
                <div class="submenu">
                    <button class="btn-prev">&lt;</button>
                    <ul class="scrollable">
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-change-size">大小</button>
                            <div class="hiddenmenu">
                                <input id="input-text-size-range" type="range" min="10" max="240" value="80" />
                            </div>
                        </li>
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-change-style">样式</button>
                            <div class="hiddenmenu">
                                <button class="hiddenmenu-button btn-change-text-style" data-style-type="bold">
                                    <b>粗体</b>
                                </button>
                                <button class="hiddenmenu-button btn-change-text-style" data-style-type="italic">
                                    <i>斜体</i>
                                </button>
                                <button class="hiddenmenu-button btn-change-text-style" data-style-type="underline">
                                    <u>下划线</u>
                                </button>
                            </div>
                        </li>
                        <!-- <li class="menu-item">
                            <button class="submenu-button" id="btn-change-align">对齐</button>
                            <div class="hiddenmenu">
                                <button class="hiddenmenu-button btn-change-text-style" data-style-type="left">
                                    靠左
                                </button>
                                <button class="hiddenmenu-button btn-change-text-style" data-style-type="center">
                                    居中
                                </button>
                                <button class="hiddenmenu-button btn-change-text-style" data-style-type="right">
                                    靠右
                                </button>
                            </div>
                        </li> -->
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-change-text-color">颜色</button>
                            <div class="hiddenmenu">
                                <div id="tui-text-color-picker"></div>
                            </div>
                        </li>
                    </ul>
                </div>
            </li>

            <li class="menu-item">
                <button class="menu-button">旋转</button>
                <div class="submenu">
                    <button class="btn-prev">&lt;</button>
                    <ul class="scrollable">
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-rotate-clockwise">旋转 +90</button>
                        </li>
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-rotate-counter-clockwise">旋转 -90</button>
                        </li>
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-flip-x">左右镜像</button>
                        </li>
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-flip-y">上下镜像</button>
                        </li>
                    </ul>
                </div>
            </li>

            <li class="menu-item">
                <button class="menu-button" id="btn-draw-line">涂鸦</button>
                <div class="submenu">
                    <button class="btn-prev">&lt;</button>
                    <ul class="scrollable">
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-free-drawing">画笔</button>
                        </li>
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-line-drawing">线笔</button>
                        </li>
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-change-size">粗细</button>
                            <div class="hiddenmenu">
                                <input id="input-brush-range" type="range" min="2" max="100" value="5" />
                            </div>
                        </li>
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-change-text-color">颜色</button>
                            <div class="hiddenmenu">
                                <div id="tui-brush-color-picker"></div>
                            </div>
                        </li>
                    </ul>
                </div>
            </li>

            <!-- <li class="menu-item">
                <button id="btnPostImage" class="menu-button">保存</button>
            </li> -->
            <!-- <li class="menu-item">
                <button id="btnCancelEdit" class="menu-button">取消</button>
            </li> -->


            <li class="menu-item" style="display:none;">
                <button class="menu-button" id="btn-crop">Crop</button>
                <div class="submenu">
                    <button class="btn-prev">&lt;</button>
                    <ul class="scrollable">
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-apply-crop">Apply</button>
                        </li>
                    </ul>
                </div>
            </li>
            <li class="menu-item" style="display:none;">
                <button class="menu-button" id="btn-draw-shape">形状</button>
                <div class="submenu">
                    <button class="btn-prev">&lt;</button>
                    <ul class="scrollable">
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-add-rect">Rectagle</button>
                        </li>
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-add-square">Square</button>
                        </li>
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-add-ellipse">Ellipse</button>
                        </li>
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-add-circle">Circle</button>
                        </li>
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-add-triangle">Triangle</button>
                        </li>
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-stroke-size">Stroke<br />Size</button>
                            <div class="hiddenmenu">
                                <input id="input-stroke-range" type="range" min="1" max="100" value="10" />
                            </div>
                        </li>
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-change-shape-color">Color</button>
                            <div class="hiddenmenu">
                                <div class="top">
                                    <label for="fill-color"><input type="radio" id="fill-color" name="select-color-type"
                                            value="fill" checked="checked" />
                                        Fill</label>
                                    <label for="stroke-color"><input type="radio" id="stroke-color"
                                            name="select-color-type" value="stroke" />
                                        Stroke</label>
                                    <label for="input-check-transparent"><input type="checkbox"
                                            id="input-check-transparent" />Transparent</label>
                                </div>
                                <div id="tui-shape-color-picker"></div>
                            </div>
                        </li>
                    </ul>
                </div>
            </li>
            <li class="menu-item" style="display:none;">
                <button class="menu-button">Icon</button>
                <div class="submenu">
                    <button class="btn-prev">&lt;</button>
                    <ul class="scrollable">
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-add-arrow-icon">Arrow<br />Icon</button>
                        </li>
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-add-cancel-icon">Cancel<br />Icon</button>
                        </li>
                        <li class="menu-item">
                            <button class="submenu-button" id="btn-change-icon-color">Color</button>
                            <div class="hiddenmenu">
                                <div id="tui-icon-color-picker"></div>
                            </div>
                        </li>
                    </ul>
                </div>
            </li>
        </ul>
        <!-- <p class="msg">Menu Scrolling <b>Left ⇔ Right</b></p> -->
    </div>
    <script crossOrigin src="js/fabric-v4.2.0.min.js"></script>
    <script crossOrigin src="js/tui-code-snippet.min.js"></script>
    <script crossOrigin src="js/tui-color-picker.min.js"></script>
    <script crossOrigin src="js/jquery.min.js"></script>
    <!-- <script crossOrigin  src="js/FileSaver.min.js"></script> -->
    <script crossOrigin src="js/tui-image-editor.min.js"></script>
    <script crossOrigin src="js/service-mobile.js?v=20220510"></script>
</body>

</html>
